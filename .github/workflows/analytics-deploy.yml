name: Deploy SAPERROR Analytics
on:
  push:
    branches: [visual-foundation]
    paths: ['analytics/deploy.request']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saperror-analytics-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/visual-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test API and database
        run: node --test test/worker.test.mjs
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.SAPERROR_DASHBOARD_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test "${#DASHBOARD_PASSWORD}" -ge 32 || { echo 'Dashboard password must have at least 32 characters'; exit 1; }
      - name: Apply D1 migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          npx --no-install wrangler d1 migrations apply saperror-analytics --remote
          npx --no-install wrangler deploy
      - name: Set private dashboard password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.SAPERROR_DASHBOARD_PASSWORD }}
          CI: 'true'
        run: printf '%s' "$DASHBOARD_PASSWORD" | npx --no-install wrangler secret put DASHBOARD_PASSWORD

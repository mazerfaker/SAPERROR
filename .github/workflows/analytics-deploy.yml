name: Deploy SAPERROR Analytics
on:
  push:
    branches: [visual-foundation]
    paths: ['analytics/deploy.request']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saperror-analytics-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/visual-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node.js 24)
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test API and database
        run: node --test test/worker.test.mjs
      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.169.0
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.SAPERROR_DASHBOARD_PASSWORD }}
        run: |
          source ./deploy-env.sh
          test "${#DASHBOARD_PASSWORD}" -ge 32 || { echo 'Dashboard password must have at least 32 characters'; exit 1; }
      - name: Apply D1 migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          source ./deploy-env.sh
          npx --no-install wrangler d1 migrations apply saperror-analytics --remote
          npx --no-install wrangler deploy
      - name: Set private dashboard password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.SAPERROR_DASHBOARD_PASSWORD }}
          CI: 'true'
        run: |
          source ./deploy-env.sh
          printf '%s' "$DASHBOARD_PASSWORD" | npx --no-install wrangler secret put DASHBOARD_PASSWORD

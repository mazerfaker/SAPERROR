name: Analytics QA
on:
  push:
    branches: [visual-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 (Node.js 24)
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test analytics/test/worker.test.mjs

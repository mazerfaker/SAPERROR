name: Windows Core + Visual QA
on:
  push:
    branches: [visual-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    if: github.ref == 'refs/heads/visual-foundation'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.7.2-stable'
      GAME_VERSION: '0.5.0-alpha.2'
    steps:
      - name: Windows prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw 'Git is not available on the Windows runner.' }
          git --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable approved PNG
        shell: pwsh
        run: |
          $asset = 'assets/art/terminal_original.png'
          $expected = '510b492cf7ef1bb83e912858570b2f2755c3dfcd907b3c063eff8a22be291bfd'
          if (!(Test-Path $asset)) { throw 'Approved PNG missing' }
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Approved PNG hash mismatch' }
          New-Item -ItemType Directory -Force build/logs | Out-Null
          "Approved PNG SHA256: $expected" | Tee-Object -FilePath build/logs/asset-integrity.txt
          "Source commit: $(git rev-parse HEAD)" | Tee-Object -FilePath build/logs/source-commit.txt
      - name: Install pinned Godot and templates (release SHA-512 verification)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/logs, build/windows, build/dist | Out-Null
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot-builds/releases/download/$v"
          $editor = "Godot_v${v}_win64.exe.zip"
          $templates = "Godot_v${v}_export_templates.tpz"
          $dir = Join-Path $env:RUNNER_TEMP 'godot-pinned'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -UseBasicParsing "$base/SHA512-SUMS.txt" -OutFile "$dir/SHA512-SUMS.txt"
          foreach ($file in @($editor,$templates)) {
            Invoke-WebRequest -UseBasicParsing "$base/$file" -OutFile "$dir/$file"
            $line = Get-Content "$dir/SHA512-SUMS.txt" | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($file) + '$') } | Select-Object -First 1
            if (-not $line) { throw "Missing checksum: $file" }
            $expected = ($line -split '\s+')[0]
            $actual = (Get-FileHash "$dir/$file" -Algorithm SHA512).Hash
            if ($actual -ne $expected) { throw "Checksum mismatch: $file" }
            "$file $actual" | Add-Content build/logs/checksums.txt
          }
          Expand-Archive "$dir/$editor" "$dir/editor" -Force
          Copy-Item "$dir/$templates" "$dir/templates.zip"
          Expand-Archive "$dir/templates.zip" "$dir/export" -Force
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$($v -replace '-', '.')"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$dir/export/templates/*" $templateDir -Recurse -Force
          $exe = Get-ChildItem "$dir/editor" -Recurse -Filter '*console.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Console Godot executable missing' }
          "GODOT_EXE=$($exe.FullName)" | Add-Content $env:GITHUB_ENV
      - name: Official icon asset gate
        shell: pwsh
        run: |
          $png = 'assets/icon/saperror.png'
          $ico = 'assets/icon/SAPERROR.ico'
          if (!(Test-Path $png) -or !(Test-Path $ico)) { throw 'Both approved icon assets are required' }
          if ((Get-FileHash $png -Algorithm SHA256).Hash.ToLower() -ne '25e8ffa77a10ef61ff4fd8bdca4d709f8026b2a0084543f767ee744a0228e52f') { throw 'Approved icon PNG hash mismatch' }
          if ((Get-FileHash $ico -Algorithm SHA256).Hash.ToLower() -ne '356fd921fa4c9de6b7a8f8ddbaa53d89ba8919e37d0fc1aac11cbd6e8c965d44') { throw 'Approved ICO hash mismatch' }
          $b = [IO.File]::ReadAllBytes((Resolve-Path $ico))
          $count = [BitConverter]::ToUInt16($b,4)
          if ([BitConverter]::ToUInt16($b,2) -ne 1 -or $count -ne 7) { throw 'ICO header mismatch' }
          $sizes = @(for ($i=0; $i -lt $count; $i++) { $n = [int]$b[6+16*$i]; if ($n -eq 0) {256} else {$n} })
          if (($sizes | Sort-Object) -join ',' -ne '16,24,32,48,64,128,256') { throw 'ICO sizes mismatch' }
          'SAPERROR_ICON_READY=true' | Add-Content $env:GITHUB_ENV
          'ICON_QA approved PNG and 7 ICO sizes verified' | Set-Content build/logs/icon-qa.txt
      - name: Verify approved live environment assets
        shell: pwsh
        run: |
          $manifest = Get-Content assets/live/approved-sha256.json -Raw | ConvertFrom-Json -AsHashtable
          $missing = @()
          foreach ($entry in $manifest.GetEnumerator()) {
            $path = Join-Path 'assets/live' $entry.Key
            if (!(Test-Path -LiteralPath $path)) { $missing += $entry.Key; continue }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $entry.Value) { throw "Approved live asset hash mismatch: $path" }
          }
          if ($missing.Count -gt 0) {
            'LIVE_ASSETS_READY=false' | Add-Content $env:GITHUB_ENV
            "LIVE_ASSETS pending upload: $($missing -join ', ')" | Tee-Object -FilePath build/logs/live-assets.txt
          } else {
            'LIVE_ASSETS_READY=true' | Add-Content $env:GITHUB_ENV
            "LIVE_ASSETS verified $($manifest.Count) exact files" | Tee-Object -FilePath build/logs/live-assets.txt
          }
      - name: Import and tests
        shell: pwsh
        run: |
          function Invoke-Godot([string]$log, [string[]]$params) {
            & $env:GODOT_EXE --no-header @params 2>&1 | Tee-Object -FilePath "build/logs/$log"
            if ($LASTEXITCODE -ne 0) { throw "Godot failed: $log" }
            if (Select-String -Path "build/logs/$log" -Pattern 'SCRIPT ERROR|Parse Error|ERROR:' -Quiet) { throw "Godot reported errors: $log" }
          }
          Invoke-Godot 'version.txt' @('--version')
          if ((Get-Content build/logs/version.txt -Raw) -notmatch '^4\.7\.2\.stable') { throw 'Unexpected Godot version' }
          Invoke-Godot 'import.txt' @('--headless','--path','.','--editor','--import')
          Invoke-Godot 'tests.txt' @('--headless','--path','.','--script','res://tests/core_test.gd')
          if (-not (Select-String -Path build/logs/tests.txt -Pattern 'CORE_QA.*failures=0.*seeds=1000' -Quiet)) { throw 'Missing QA success marker' }
          Invoke-Godot 'visual-tests.txt' @('--headless','--path','.','--script','res://tests/visual_test.gd')
          if (-not (Select-String -Path build/logs/visual-tests.txt -Pattern 'VISUAL_QA.*failures=0' -Quiet)) { throw 'Missing visual QA marker' }
          Invoke-Godot 'audio-tests.txt' @('--headless','--path','.','--script','res://tests/audio_test.gd')
          if (-not (Select-String -Path build/logs/audio-tests.txt -Pattern 'AUDIO_QA.*failures=0' -Quiet)) { throw 'Missing audio QA marker' }
          Invoke-Godot 'lifecycle-tests.txt' @('--headless','--path','.','--script','res://tests/lifecycle_test.gd')
          if (-not (Select-String -Path build/logs/lifecycle-tests.txt -Pattern 'LIFECYCLE_QA.*failures=0' -Quiet)) { throw 'Missing lifecycle QA marker' }
          Invoke-Godot 'onboarding-tests.txt' @('--headless','--path','.','--script','res://tests/onboarding_test.gd')
          if (-not (Select-String -Path build/logs/onboarding-tests.txt -Pattern 'ONBOARDING_QA.*failures=0' -Quiet)) { throw 'Missing onboarding QA marker' }
          Invoke-Godot 'protocol-tests.txt' @('--headless','--path','.','--script','res://tests/protocol_test.gd')
          if (-not (Select-String -Path build/logs/protocol-tests.txt -Pattern 'PROTOCOL_QA.*failures=0' -Quiet)) { throw 'Missing protocol QA marker' }
          Invoke-Godot 'tools-tests.txt' @('--headless','--path','.','--script','res://tests/tools_test.gd')
          if (-not (Select-String -Path build/logs/tools-tests.txt -Pattern 'TOOLS_QA.*failures=0' -Quiet)) { throw 'Missing tools QA marker' }
          Invoke-Godot 'economy-tests.txt' @('--headless','--path','.','--script','res://tests/economy_test.gd')
          if (-not (Select-String -Path build/logs/economy-tests.txt -Pattern 'ECONOMY_QA.*failures=0' -Quiet)) { throw 'Missing economy QA marker' }
          Invoke-Godot 'survival-tests.txt' @('--headless','--path','.','--script','res://tests/survival_test.gd')
          if (-not (Select-String -Path build/logs/survival-tests.txt -Pattern 'SURVIVAL_QA.*failures=0' -Quiet)) { throw 'Missing survival QA marker' }
          Invoke-Godot 'advanced-tests.txt' @('--headless','--path','.','--script','res://tests/advanced_builds_test.gd')
          if (-not (Select-String -Path build/logs/advanced-tests.txt -Pattern 'ADVANCED_QA.*failures=0' -Quiet)) { throw 'Missing advanced QA marker' }
          Invoke-Godot 'live-tests.txt' @('--headless','--path','.','--script','res://tests/live_environment_test.gd')
          if (-not (Select-String -Path build/logs/live-tests.txt -Pattern 'LIVE_QA.*failures=0' -Quiet)) { throw 'Missing live QA marker' }
          if ($env:LIVE_ASSETS_READY -ne 'true') { throw 'Live integration requires all approved files; no fallback release packaging' }
          Invoke-Godot 'phantom-tests.txt' @('--headless','--path','.','--script','res://tests/phantom_test.gd')
          if (-not (Select-String -Path build/logs/phantom-tests.txt -Pattern 'PHANTOM_QA.*failures=0' -Quiet)) { throw 'Missing phantom QA marker' }
          Invoke-Godot 'parasite-tests.txt' @('--headless','--path','.','--script','res://tests/parasite_test.gd')
          if (-not (Select-String -Path build/logs/parasite-tests.txt -Pattern 'PARASITE_QA.*failures=0' -Quiet)) { throw 'Missing parasite QA marker' }
          Invoke-Godot 'export.txt' @('--headless','--path','.','--export-release','Windows Desktop','build/windows/SAPERROR.exe')
      - name: Native render and audio QA
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'build/logs/live-render.txt'
          $args = @('--path','.', '--windowed','--resolution','1280x720','--script','res://tests/live_render_test.gd','--log-file', $log)
          try {
            $proc = Start-Process -FilePath $env:GODOT_EXE -ArgumentList $args -PassThru
            if (!$proc.WaitForExit(90000)) { $proc.Kill(); throw 'Native renderer timed out' }
            if ($proc.ExitCode -ne 0 -or !(Test-Path $log) -or !(Select-String -Path $log -Pattern 'LIVE_RENDER failures=0' -Quiet)) { throw 'Native render/audio QA did not pass' }
            'LIVE_RENDER confirmed native composition and audio smoke' | Set-Content build/logs/live-render-status.txt
          } catch {
            "LIVE_RENDER UNCONFIRMED: $_ ; manual GPU/audio QA required" | Tee-Object -FilePath build/logs/live-render-status.txt
            Write-Warning 'Native render or audio validation unavailable/failed. Do not treat package as visually accepted.'
          }
      - name: Verify and headless smoke
        shell: pwsh
        run: |
          foreach ($f in @('build/windows/SAPERROR.exe','build/windows/SAPERROR.pck')) {
            if (!(Test-Path $f) -or (Get-Item $f).Length -le 0) { throw "Missing $f" }
            Get-FileHash $f | Out-File -Append build/logs/artifact-hashes.txt
          }
          $p = Start-Process -FilePath (Resolve-Path build/windows/SAPERROR.exe) -ArgumentList '--headless','--quit-after','5','--log-file', (Join-Path $PWD 'build/logs/smoke.txt') -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Smoke timeout' }
          if ($p.ExitCode -ne 0) { throw "Smoke exit $($p.ExitCode)" }
          if (!(Test-Path build/logs/smoke.txt)) { throw 'Smoke log absent' }
          if (Select-String -Path build/logs/smoke.txt -Pattern 'SCRIPT ERROR|Parse Error|ERROR:' -Quiet) { throw 'Smoke errors' }
      - name: Verify exported Windows icon
        if: env.SAPERROR_ICON_READY == 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path build/windows/SAPERROR.exe))
          if ($null -eq $exe) { throw 'EXE icon missing' }
          $expected = [System.Drawing.Icon]::new((Resolve-Path assets/icon/SAPERROR.ico).Path,$exe.Width,$exe.Height)
          $actualBmp = $exe.ToBitmap()
          $expectedBmp = $expected.ToBitmap()
          try {
            $diff = 0.0
            for ($y=0; $y -lt $actualBmp.Height; $y++) {
              for ($x=0; $x -lt $actualBmp.Width; $x++) {
                $a = $actualBmp.GetPixel($x,$y); $b = $expectedBmp.GetPixel($x,$y)
                $diff += [Math]::Abs([int]$a.R-[int]$b.R)+[Math]::Abs([int]$a.G-[int]$b.G)+[Math]::Abs([int]$a.B-[int]$b.B)
              }
            }
            $mean = $diff/(3*$actualBmp.Width*$actualBmp.Height)
            if ($mean -gt 25) { throw "EXE icon differs from approved icon: $mean" }
            "ICON_QA EXE associated icon matches, mean channel difference $mean" | Add-Content build/logs/icon-qa.txt
          } finally { $actualBmp.Dispose(); $expectedBmp.Dispose(); $exe.Dispose(); $expected.Dispose() }
      - name: Package portable and source
        shell: pwsh
        run: |
          Copy-Item README.md build/windows/README.md
          if ($env:SAPERROR_ICON_READY -eq 'true') { Copy-Item assets/icon/SAPERROR.ico build/windows/SAPERROR.ico }
          Compress-Archive -Path build/windows/* -DestinationPath "build/dist/SAPERROR_v${env:GAME_VERSION}_Windows_x64.zip"
          git archive --format=zip -o "build/dist/SAPERROR_v${env:GAME_VERSION}_Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $base = '1e6bc1fdc00784a9a272a8434a68efc2c4ac8e41'
          git diff --binary --output=build/dist/changes.patch $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Patch creation failed' }
          "Base: $base" | Out-File build/dist/patch-base.txt
          Compress-Archive -Path build/dist/changes.patch,build/dist/patch-base.txt -DestinationPath "build/dist/SAPERROR_v${env:GAME_VERSION}_Patch.zip"
          # Inspect actual ZIP contents, not only the existence of output paths.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @{
            "SAPERROR_v${env:GAME_VERSION}_Windows_x64.zip" = @('SAPERROR.exe','SAPERROR.pck','README.md')
            "SAPERROR_v${env:GAME_VERSION}_Source.zip" = @('project.godot','export_presets.cfg','docs/SAPERROR_GDD.md','assets/art/terminal_original.png','assets/live/config.json','assets/live/assets/base.png','assets/live/assets/audio/01_Old_Ballast(3).wav','assets/audio/finntastico-old-computer-click-152513.mp3')
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path $PWD "build/dist/$name"
            $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
            try {
              foreach ($entry in $expected[$name]) {
                $item = $zip.GetEntry($entry)
                if ($null -eq $item -or $item.Length -le 0) { throw "Missing or empty ZIP entry: $name / $entry" }
                "ZIP_QA $name / $entry : $($item.Length) bytes" | Tee-Object -FilePath build/logs/package-validation.txt -Append
              }
            } finally { $zip.Dispose() }
            Get-FileHash $path | Out-File -Append build/logs/artifact-hashes.txt
          }
      - name: Upload build ZIPs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SAPERROR-packages
          path: build/dist/*.zip
          if-no-files-found: error
      - name: Upload QA logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SAPERROR-QA-logs
          path: build/logs/
          if-no-files-found: warn

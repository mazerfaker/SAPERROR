name: Windows Core + Visual QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GODOT_VERSION: '4.7.2-stable'
      GAME_VERSION: '0.2.2-alpha'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify approved PNG
        shell: pwsh
        run: |
          $asset = 'assets/art/terminal_original.png'
          $expected = '510b492cf7ef1bb83e912858570b2f2755c3dfcd907b3c063eff8a22be291bfd'
          if (Test-Path '.asset-transfer') {
            if ('${{ github.ref }}' -ne 'refs/heads/visual-foundation') { throw 'Asset reconstruction is restricted to visual-foundation' }
            $parts = @(Get-ChildItem '.asset-transfer/part-*.b64' | Sort-Object Name)
            if ($parts.Count -ne 6) { throw 'Missing asset transfer part' }
            $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join ''
            New-Item -ItemType Directory -Force assets/art | Out-Null
            [IO.File]::WriteAllBytes((Join-Path $PWD $asset),[Convert]::FromBase64String($encoded))
            if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Approved PNG hash mismatch' }
            if ((git hash-object $asset) -ne '4c06dba23194f5178373a34a472377fbf77b2274') { throw 'Git blob hash mismatch' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $asset
            if ($LASTEXITCODE -ne 0) { throw 'Asset staging failed' }
            git rm -r -- .asset-transfer
            if ($LASTEXITCODE -ne 0) { throw 'Transfer cleanup failed' }
            git commit -m 'assets: store byte-identical approved SAPERROR terminal PNG'
            if ($LASTEXITCODE -ne 0) { throw 'Asset commit failed' }
            git push origin HEAD:refs/heads/visual-foundation
            if ($LASTEXITCODE -ne 0) { throw 'Asset commit push failed' }
          }
          if (!(Test-Path $asset)) { throw 'Approved PNG missing' }
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Approved PNG hash mismatch' }
          New-Item -ItemType Directory -Force build/logs | Out-Null
          "Approved PNG SHA256: $expected" | Tee-Object -FilePath build/logs/asset-integrity.txt
          "Source commit: $(git rev-parse HEAD)" | Tee-Object -FilePath build/logs/source-commit.txt
      - name: Install pinned Godot and templates (release SHA-512 verification)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/logs, build/windows, build/dist | Out-Null
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot-builds/releases/download/$v"
          $editor = "Godot_v${v}_win64.exe.zip"
          $templates = "Godot_v${v}_export_templates.tpz"
          $dir = Join-Path $env:RUNNER_TEMP 'godot-pinned'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile "$dir/SHA512-SUMS.txt"
          foreach ($file in @($editor,$templates)) {
            Invoke-WebRequest "$base/$file" -OutFile "$dir/$file"
            $line = Get-Content "$dir/SHA512-SUMS.txt" | Where-Object { $_ -match ('\s\*?' + [regex]::Escape($file) + '$') } | Select-Object -First 1
            if (-not $line) { throw "Missing checksum: $file" }
            $expected = ($line -split '\s+')[0]
            $actual = (Get-FileHash "$dir/$file" -Algorithm SHA512).Hash
            if ($actual -ne $expected) { throw "Checksum mismatch: $file" }
            "$file $actual" | Add-Content build/logs/checksums.txt
          }
          Expand-Archive "$dir/$editor" "$dir/editor" -Force
          Copy-Item "$dir/$templates" "$dir/templates.zip"
          Expand-Archive "$dir/templates.zip" "$dir/export" -Force
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/$($v -replace '-', '.')"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$dir/export/templates/*" $templateDir -Recurse -Force
          $exe = Get-ChildItem "$dir/editor" -Recurse -Filter '*console.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Console Godot executable missing' }
          "GODOT_EXE=$($exe.FullName)" | Add-Content $env:GITHUB_ENV
      - name: Import and tests
        shell: pwsh
        run: |
          function Invoke-Godot([string]$log, [string[]]$params) {
            & $env:GODOT_EXE --no-header @params 2>&1 | Tee-Object -FilePath "build/logs/$log"
            if ($LASTEXITCODE -ne 0) { throw "Godot failed: $log" }
            if (Select-String -Path "build/logs/$log" -Pattern 'SCRIPT ERROR|Parse Error|ERROR:' -Quiet) { throw "Godot reported errors: $log" }
          }
          Invoke-Godot 'version.txt' @('--version')
          if ((Get-Content build/logs/version.txt -Raw) -notmatch '^4\.7\.2\.stable') { throw 'Unexpected Godot version' }
          Invoke-Godot 'import.txt' @('--headless','--path','.','--editor','--import')
          Invoke-Godot 'tests.txt' @('--headless','--path','.','--script','res://tests/core_test.gd')
          if (-not (Select-String -Path build/logs/tests.txt -Pattern 'CORE_QA.*failures=0.*seeds=1000' -Quiet)) { throw 'Missing QA success marker' }
          Invoke-Godot 'visual-tests.txt' @('--headless','--path','.','--script','res://tests/visual_test.gd')
          if (-not (Select-String -Path build/logs/visual-tests.txt -Pattern 'VISUAL_QA.*failures=0' -Quiet)) { throw 'Missing visual QA marker' }
          Invoke-Godot 'audio-tests.txt' @('--headless','--path','.','--script','res://tests/audio_test.gd')
          if (-not (Select-String -Path build/logs/audio-tests.txt -Pattern 'AUDIO_QA.*failures=0' -Quiet)) { throw 'Missing audio QA marker' }
          Invoke-Godot 'export.txt' @('--headless','--path','.','--export-release','Windows Desktop','build/windows/SAPERROR.exe')
      - name: Verify and headless smoke
        shell: pwsh
        run: |
          foreach ($f in @('build/windows/SAPERROR.exe','build/windows/SAPERROR.pck')) {
            if (!(Test-Path $f) -or (Get-Item $f).Length -le 0) { throw "Missing $f" }
            Get-FileHash $f | Out-File -Append build/logs/artifact-hashes.txt
          }
          $p = Start-Process -FilePath (Resolve-Path build/windows/SAPERROR.exe) -ArgumentList '--headless','--quit-after','5','--log-file', (Join-Path $PWD 'build/logs/smoke.txt') -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Smoke timeout' }
          if ($p.ExitCode -ne 0) { throw "Smoke exit $($p.ExitCode)" }
          if (!(Test-Path build/logs/smoke.txt)) { throw 'Smoke log absent' }
          if (Select-String -Path build/logs/smoke.txt -Pattern 'SCRIPT ERROR|Parse Error|ERROR:' -Quiet) { throw 'Smoke errors' }
      - name: Package portable and source
        shell: pwsh
        run: |
          Copy-Item README.md build/windows/README.md
          Compress-Archive -Path build/windows/* -DestinationPath "build/dist/SAPERROR_v${env:GAME_VERSION}_Windows_x64.zip"
          git archive --format=zip -o "build/dist/SAPERROR_v${env:GAME_VERSION}_Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $base = '1e6bc1fdc00784a9a272a8434a68efc2c4ac8e41'
          git diff --binary --output=build/dist/changes.patch $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Patch creation failed' }
          "Base: $base" | Out-File build/dist/patch-base.txt
          Compress-Archive -Path build/dist/changes.patch,build/dist/patch-base.txt -DestinationPath "build/dist/SAPERROR_v${env:GAME_VERSION}_Patch.zip"
          # Inspect actual ZIP contents, not only the existence of output paths.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @{
            "SAPERROR_v${env:GAME_VERSION}_Windows_x64.zip" = @('SAPERROR.exe','SAPERROR.pck','README.md')
            "SAPERROR_v${env:GAME_VERSION}_Source.zip" = @('project.godot','export_presets.cfg','docs/SAPERROR_GDD.md','assets/art/terminal_original.png')
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path $PWD "build/dist/$name"
            $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
            try {
              foreach ($entry in $expected[$name]) {
                $item = $zip.GetEntry($entry)
                if ($null -eq $item -or $item.Length -le 0) { throw "Missing or empty ZIP entry: $name / $entry" }
                "ZIP_QA $name / $entry : $($item.Length) bytes" | Tee-Object -FilePath build/logs/package-validation.txt -Append
              }
            } finally { $zip.Dispose() }
            Get-FileHash $path | Out-File -Append build/logs/artifact-hashes.txt
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SAPERROR-packages
          path: build/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SAPERROR-QA-logs
          path: build/logs/
          if-no-files-found: warn
